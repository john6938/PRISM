<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PRISM: Pattern Recognition and Investigation of Shared Matches</title>
    <meta name="description" content="Discover, compare and inspect shared lexical, grammatical and hybrid patterns across text datasets." />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <style>
      /* Startup screen: inline so it paints before any script or stylesheet loads. */
      html, body { margin: 0; background: #3b3b3b; }
      #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #3b3b3b; color: #f0f0f0; font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; transition: opacity .35s; }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash .s-logo { width: 56px; height: 56px; border-radius: 10px; display: block; }
      #splash .s-name { font-size: 26px; font-weight: 700; letter-spacing: .04em; }
      #splash .s-full { margin-top: -12px; color: #d0d0d0; font-size: 14px; text-align: center; padding: 0 16px; }
      #splash .s-bar { width: 220px; height: 4px; border-radius: 4px; background: #555555; overflow: hidden; }
      #splash .s-bar::after { content: ""; display: block; width: 40%; height: 100%; background: #ff8c00; border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
      #splash.failed .s-bar { display: none; }
      #splash #splash-status { color: #c4c4c4; font-size: 13px; text-align: center; max-width: 360px; padding: 0 16px; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #splash .s-bar::after { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite">
      <img class="s-logo" src="./logo.png" alt="" width="56" height="56" />
      <div class="s-name">PRISM</div>
      <div class="s-full">Pattern Recognition and Investigation of Shared Matches</div>
      <div class="s-bar" aria-hidden="true"></div>
      <div id="splash-status">Starting…</div>
      <noscript><p style="color:#f0f0f0">PRISM needs JavaScript enabled.</p></noscript>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
